[project]
name = "sqlplay"
version = "0.1.0"
description = "Local SQL practice playground: endless HOA-style PostgreSQL challenges"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "pglast>=7",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rich>=13",
    "prompt-toolkit>=3",
    "python-dotenv>=1",
]

[project.optional-dependencies]
ai = ["openai>=1.40"]

[project.scripts]
psqlay = "sqlplay.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sqlplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
