<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>psqlay</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="bar" id="bar">
  <div class="brand">psqlay<span class="cursor"></span></div>

  <nav class="crumbs">
    <label class="pick" title="World">
      <span class="pick-emoji" id="world-emoji"></span>
      <select id="world" aria-label="World"></select>
      <svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg>
    </label>
    <span class="sep">/</span>
    <label class="pick" title="What to practise">
      <select id="topic" aria-label="Practice mode"></select>
      <svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg>
    </label>
  </nav>

  <div class="grow"></div>

  <div class="stats">
    <div class="stat"><span class="num" id="score">0</span><span class="lbl">score</span></div>
    <div class="stat"><span class="num" id="streak">0</span><span class="lbl">streak</span></div>
  </div>
  <button class="ai-dot" id="ai-dot"><i></i><span>AI</span></button>
  <button class="link gear" id="settings-btn" title="Settings">Settings</button>
  <button class="link" id="newworld-btn">New world</button>
  <button class="pill" id="exam-btn">Exam</button>
</header>

<header class="bar exam-bar" id="exam-bar" hidden>
  <div class="brand">exam<span class="cursor"></span></div>
  <div class="exam-dots" id="exam-dots"></div>
  <div class="grow"></div>
  <span class="timer" id="exam-timer"></span>
  <button class="link" id="exam-quit">Abandon</button>
  <button class="pill" id="exam-submit">Submit</button>
</header>

<div class="qbar" id="qbar" hidden>
  <div class="qbar-in">
    <div class="qbar-top">
      <span class="dots" id="qb-dots"></span><span id="qb-meta"></span>
      <span class="grow"></span>
      <button class="qb-btn" id="qb-exp">expected</button>
      <button class="qb-btn" id="qb-close" title="Stop pinning the question">unpin</button>
    </div>
    <p class="qb-text" id="qb-text"></p>
    <div class="qb-reqs" id="qb-reqs"></div>
    <div class="qb-expected" id="qb-expected" hidden></div>
  </div>
</div>

<div class="app">
  <aside class="rail" id="rail">
    <div class="rail-sec">
      <h6>Schema</h6>
      <div id="schema"></div>
    </div>
    <div class="rail-sec">
      <h6>Join map</h6>
      <div class="joinmap" id="joinmap"></div>
      <div class="notes" id="notes"></div>
    </div>
    <div class="rail-sec">
      <h6>Progress</h6>
      <div id="levels"></div>
      <div class="session" id="session"></div>
    </div>
  </aside>

  <main class="stage" id="stage">
    <section class="q" id="q">
      <div class="meta">
        <span class="dots" id="q-dots"></span>
        <span id="q-meta"></span>
      </div>
      <p class="qtext" id="q-text"></p>
      <dl class="reqs" id="q-reqs"></dl>
      <div class="expected" id="expected"></div>
      <div class="hints" id="hints"></div>
    </section>

    <section class="term" id="term">
      <div class="term-body">
        <div class="gutter" id="gutter" aria-hidden="true"></div>
        <textarea id="sql" spellcheck="false" autocapitalize="off" autocomplete="off" rows="3" wrap="off"
          placeholder="SELECT …"></textarea>
      </div>
      <div class="term-foot">
        <div class="keys" id="keys"></div>
        <div class="grow"></div>
        <button class="try" id="try-btn">Try <kbd>⇧⌘↵</kbd></button>
        <button class="run" id="run-btn">Run <kbd>⌘↵</kbd></button>
      </div>
    </section>

    <section class="out" id="out"></section>
    <section class="report" id="report" hidden></section>
  </main>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div id="sheet-body"></div>
    <div class="sheet-actions">
      <button class="link" id="sheet-cancel">Cancel</button>
      <button class="pill" id="sheet-ok">OK</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="/static/app.js"></script>
</body>
</html>
